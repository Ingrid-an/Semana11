{% extends "catalogo/base.html" %}

{% block titulo %}{{ titulo }} · Raíces Verdes{% endblock %}

{% block contenido %}
  <div style="max-width:560px; margin:0 auto;">
    <div style="display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--borde); padding-bottom:1rem; margin-bottom:2rem;">
      <h2 style="font-size:2.4rem; color:var(--salvia-prof);">{{ titulo }}</h2>
      <span style="font-family:'Cormorant Garamond',serif; font-size:2.6rem; color:var(--salvia); font-weight:700;">✎</span>
    </div>

    <form method="post" style="background:var(--crema-pura); border:1px solid var(--borde); padding:2rem; border-radius:2px;">
      {% csrf_token %}

      {% for campo in form %}
        <div style="margin-bottom:1.25rem;">
          <label style="display:block; text-transform:uppercase; letter-spacing:0.12em; font-size:0.72rem; color:var(--salvia-osc); margin-bottom:0.4rem;">
            {{ campo.label }}
          </label>
          {{ campo }}
          {% if campo.errors %}
            <p style="color:#c0392b; font-size:0.8rem; margin-top:0.3rem;">{{ campo.errors.0 }}</p>
          {% endif %}
        </div>
      {% endfor %}

      <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
        <button type="submit"
          style="flex:1; background:var(--salvia-prof); color:var(--crema-pura); border:none; padding:0.85rem; text-transform:uppercase; letter-spacing:0.15em; font-size:0.78rem; cursor:pointer;">
          Guardar
        </button>
        <a href="{% url 'catalogo:lista' %}"
          style="flex:1; text-align:center; background:transparent; color:var(--tinta-suave); border:1px solid var(--borde); padding:0.85rem; text-decoration:none; text-transform:uppercase; letter-spacing:0.15em; font-size:0.78rem;">
          Cancelar
        </a>
      </div>
    </form>
  </div>

  <style>
    /* Estilo de los campos del formulario de Django */
    form input[type="text"], form input[type="number"], form select {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--borde);
      border-radius: 2px;
      font-family: "Jost", sans-serif;
      font-size: 0.95rem;
      background: #fff;
      color: var(--tinta);
    }
    form input:focus, form select:focus {
      outline: none;
      border-color: var(--salvia);
    }
    form input[type="checkbox"] { width: auto; transform: scale(1.3); margin-right: 0.5rem; }
  </style>
{% endblock %}
