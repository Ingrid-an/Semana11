<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bloque de título: cada página lo personaliza -->
    <title>{% block titulo %}Vivero Raíces Verdes{% endblock %}</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, sans-serif; background: #f0f5ee; color: #1f2d22; }
      header {
        background: linear-gradient(135deg, #2f5233, #4c8c4a);
        color: #fff; padding: 1.5rem; text-align: center;
      }
      header h1 { font-size: 1.6rem; }
      nav { margin-top: 0.75rem; display: flex; gap: 1rem; justify-content: center; }
      nav a {
        color: #fff; text-decoration: none; font-weight: 600; font-size: 0.9rem;
        padding: 0.3rem 0.9rem; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px;
      }
      nav a:hover { background: rgba(255,255,255,0.18); }
      main { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
      footer {
        text-align: center; padding: 1.5rem; color: #5a6b5d; font-size: 0.82rem;
        border-top: 1px solid #d8e3d4; margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🌱 Vivero Raíces Verdes</h1>
      <nav>
        <a href="{% url 'catalogo:home' %}">Inicio</a>
        <a href="{% url 'catalogo:lista' %}">Catálogo</a>
      </nav>
    </header>

    <main>
      <!-- Bloque de contenido: lo rellena cada página hija -->
      {% block contenido %}{% endblock %}
    </main>

    <footer>
      Semana 11 · Desarrollo de Aplicaciones Web (IS093A) · Django MTV
    </footer>
  </body>
</html>
