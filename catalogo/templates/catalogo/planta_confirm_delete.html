{% extends "catalogo/base.html" %}

{% block titulo %}Eliminar planta · Raíces Verdes{% endblock %}

{% block contenido %}
  <div style="max-width:480px; margin:2rem auto; background:var(--crema-pura); border:1px solid var(--borde); padding:2.5rem; border-radius:2px; text-align:center;">
    <p style="font-size:3rem;">🗑️</p>
    <h2 style="font-size:2rem; color:var(--salvia-prof); margin:0.5rem 0;">¿Eliminar esta planta?</h2>
    <p style="color:var(--tinta-suave); margin-bottom:1.5rem;">
      Estás por eliminar <strong>«{{ object.nombre }}»</strong> ({{ object.especie }}).
      Esta acción no se puede deshacer.
    </p>

    <form method="post" style="display:flex; gap:0.75rem;">
      {% csrf_token %}
      <button type="submit"
        style="flex:1; background:#c0392b; color:#fff; border:none; padding:0.85rem; text-transform:uppercase; letter-spacing:0.15em; font-size:0.78rem; cursor:pointer;">
        Sí, eliminar
      </button>
      <a href="{% url 'catalogo:lista' %}"
        style="flex:1; text-align:center; background:transparent; color:var(--tinta-suave); border:1px solid var(--borde); padding:0.85rem; text-decoration:none; text-transform:uppercase; letter-spacing:0.15em; font-size:0.78rem;">
        Cancelar
      </a>
    </form>
  </div>
{% endblock %}
